<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #0E9488; } a:hover { color: #0B7A70; }
  </style>
<style>html,body{margin:0;padding:0}</style></head>
<body style="width:1080px;height:2400px;background:#0E9488;font-family:'Instrument Sans',Arial,sans-serif;overflow:hidden">
<div style="display:flex;flex-direction:column;align-items:center;height:2400px">
  <div style="padding:110px 90px 60px 90px;text-align:center">
    <div style="font-size:66px;font-weight:700;letter-spacing:-1.5px;line-height:1.12;color:#FFFFFF">Type it like you say it</div>
    <div style="font-size:32px;font-weight:500;margin-top:22px;line-height:1.4;color:rgba(255,255,255,0.85)">&ldquo;coffee 120, uber 250 and groceries 900&rdquo; &mdash; AI logs all three</div>
  </div>
  <div style="width:808px;height:1716px;border-radius:100px;border:14px solid #101A26;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(10,15,28,0.35)">
    <div style="transform:scale(2);transform-origin:top left;width:390px;height:844px"><div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F8F8; color: #101A26; overflow: hidden">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 66px 20px 16px 20px; overflow: hidden">

    <!-- Header -->
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 24px; font-weight: 700; color: #101A26">Quick Log</span>
      <span style="font-size: 13px; font-weight: 500; color: #5B6B78">Type it in plain language — AI does the rest</span>
    </div>

    <!-- Smart input card -->
    <div style="background: #FFFFFF; border: 1px solid #E7EDEE; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 6px 24px rgba(16, 26, 38, 0.05)">
      <div style="padding: 20px; min-height: 116px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 20px; line-height: 1.5; color: #101A26">coffee 120, uber 250</span>
        <span style="font-size: 20px; line-height: 1.5; color: #101A26">and groceries 900<span style="display: inline-block; width: 2px; height: 22px; background: #0E9488; transform: translateY(4px); margin-left: 2px"></span></span>
      </div>
      <div style="height: 1px; background: #EEF3F4"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px">
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#0E9488"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"></path><path d="M19 15l0.9 2.6L22.5 18.5l-2.6 0.9L19 22l-0.9-2.6L15.5 18.5l2.6-0.9z"></path></svg>
          <span style="font-size: 13px; font-weight: 600; color: #0E9488">3 items detected</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #E3EAEC; border-radius: 999px; padding: 10px 14px; min-height: 44px; background: #F5F8F8">
          <span style="font-size: 13px; font-weight: 600; color: #101A26">Today</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6B78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M3 10h18"></path></svg>
        </div>
      </div>
    </div>

    <!-- Live preview -->
    <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-height: 0">
      <div style="background: #FFFFFF; border: 1px solid #E7EDEE; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #FDF0DE; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C07A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path><path d="M7 9h10a4 4 0 0 1 0 8h-0.5"></path><path d="M7 9v6a4 4 0 0 0 8 0V9"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 600; color: #101A26">Coffee</span>
          <span style="font-size: 12px; color: #8A98A5">Food</span>
        </div>
        <span style="font-size: 14px; font-weight: 700; color: #101A26">-$120.00</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E7EDEE; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #E7EDFB; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4560B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-3l2-5h12l2 5v3z"></path><circle cx="7.5" cy="16" r="0.5"></circle><circle cx="16.5" cy="16" r="0.5"></circle></svg>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 600; color: #101A26">Uber</span>
          <span style="font-size: 12px; color: #8A98A5">Transport</span>
        </div>
        <span style="font-size: 14px; font-weight: 700; color: #101A26">-$250.00</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E7EDEE; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <div style="width: 40px; height: 40px; border-radius: 13px; background: #FDF0DE; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C07A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 12H7.2z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 600; color: #101A26">Groceries</span>
          <span style="font-size: 12px; color: #8A98A5">Food</span>
        </div>
        <span style="font-size: 14px; font-weight: 700; color: #101A26">-$900.00</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </div>
    </div>

    <!-- Save button -->
    <div style="background: #0E9488; border-radius: 18px; min-height: 56px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(14, 148, 136, 0.3)">
      <span style="font-size: 17px; font-weight: 700; color: #FFFFFF">Save 3 items</span>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="height: 84px; background: #FFFFFF; border-top: 1px solid #E7EDEE; display: flex; align-items: center; justify-content: space-around; padding: 0 12px 14px 12px">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path></svg>
    </div>
    <div style="width: 60px; height: 60px; border-radius: 30px; background: #0B7A70; display: flex; align-items: center; justify-content: center; margin-top: -34px; box-shadow: 0 10px 22px rgba(14, 148, 136, 0.45)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12"></path><path d="M12 20V5"></path><path d="M19 20v-6"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 5-5 8-5s6.5 1 8 5"></path></svg>
    </div>
  </div>
</div></div>
  </div>
</div>
</body></html>
